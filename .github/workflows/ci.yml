name: CI

# Every bot, with the meocord its lockfile pins and with the newest release on npm: install, lint, test, a production
# build, and a start with no token and with one Discord refuses. No Discord token is used or stored anywhere. The daily
# run catches a meocord release that breaks a bot before a pull request does.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bots:
    name: Find the bots
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bots: ${{ steps.list.outputs.bots }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: List the bots
        id: list
        run: echo "bots=$(node scripts/bots.mjs)" >> "$GITHUB_OUTPUT"

  bot:
    name: ${{ matrix.bot }} (${{ matrix.meocord }})
    needs: bots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        bot: ${{ fromJSON(needs.bots.outputs.bots) }}
        meocord: [pinned, latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ${{ matrix.bot }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.bot }}
        run: npm ci

      - name: Install the newest meocord
        if: matrix.meocord == 'latest'
        working-directory: ${{ matrix.bot }}
        run: npm install --no-save meocord@latest

      - name: Show the meocord under test
        working-directory: ${{ matrix.bot }}
        run: npm ls meocord

      # The bot's lint fixes what it can, so a file it changes is one that was committed unformatted
      - name: Lint
        working-directory: ${{ matrix.bot }}
        run: |
          npm run lint
          git diff --exit-code

      - name: Test
        working-directory: ${{ matrix.bot }}
        run: npm test

      - name: Build for production
        working-directory: ${{ matrix.bot }}
        run: npm run build:prod

      - name: Start without a valid token
        run: node scripts/smoke-start.mjs ${{ matrix.bot }}

  # One check for branch protection to require, however many bots the matrix holds
  ci:
    name: CI
    needs: [bots, bot]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every bot passed
        env:
          BOTS: ${{ needs.bots.result }}
          BOT: ${{ needs.bot.result }}
        run: |
          echo "Find the bots: $BOTS; bots: $BOT"
          test "$BOTS" = success && test "$BOT" = success
