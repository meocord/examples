name: CI

# Every bot, with the meocord its lockfile pins and with the newest release on npm, on the newest Node LTS and on the
# oldest Node meocord supports, and with the beta release while one is newer (scripts/bots.mjs builds the rows):
# install, lint, test, a production build, and a start with no token and with one Discord refuses. No Discord token is
# used or stored anywhere. The daily run catches a meocord release that breaks a bot before a pull request does.
on:
  pull_request:
  # The merge queue runs CI on each queued pull request merged with main, and lands it only if CI passes there
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A pull request's new push replaces its run; a merge group's ref is its own, and main's runs all finish
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bots:
    name: Find the bots
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: List the bots and the versions to test
        id: list
        run: echo "matrix=$(node scripts/bots.mjs)" >> "$GITHUB_OUTPUT"

  scripts:
    name: Scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Test the scripts CI runs
        run: node --test "scripts/**/*.test.mjs"

  bot:
    name: ${{ matrix.bot }} (meocord ${{ matrix.meocord }}, Node ${{ matrix.node }})
    needs: bots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.bots.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.bot }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.bot }}
        run: npm ci

      - name: Install meocord@${{ matrix.meocord }}
        if: matrix.meocord != 'pinned'
        working-directory: ${{ matrix.bot }}
        run: npm install --no-save meocord@${{ matrix.meocord }}

      # Read from the installed package: `npm ls` exits 1 for a version outside the bot's range, as a beta or a new major
      - name: Show the meocord under test
        working-directory: ${{ matrix.bot }}
        run: node -p "'meocord ' + require('./node_modules/meocord/package.json').version"

      # The bot's lint fixes what it can, so a file it changes is one that was committed unformatted
      - name: Lint
        working-directory: ${{ matrix.bot }}
        run: |
          npm run lint
          git diff --exit-code

      - name: Test
        working-directory: ${{ matrix.bot }}
        run: npm test

      - name: Build for production
        working-directory: ${{ matrix.bot }}
        run: npm run build:prod

      - name: Start without a valid token
        run: node scripts/smoke-start.mjs ${{ matrix.bot }}

  # One check for branch protection to require, however many bots the matrix holds
  ci:
    name: CI
    needs: [scripts, bots, bot]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed
        env:
          SCRIPTS: ${{ needs.scripts.result }}
          BOTS: ${{ needs.bots.result }}
          BOT: ${{ needs.bot.result }}
        run: |
          echo "Scripts: $SCRIPTS; find the bots: $BOTS; bots: $BOT"
          test "$SCRIPTS" = success && test "$BOTS" = success && test "$BOT" = success
